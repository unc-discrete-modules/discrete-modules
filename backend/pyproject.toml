[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the discrete mathematics modules"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic-settings==2.15.0",
    "sqlmodel==0.0.47",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.16.10",
]
