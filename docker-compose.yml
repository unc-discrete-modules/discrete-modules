services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: development
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-discrete_modules}:${POSTGRES_PASSWORD:-discrete_modules}@postgres:5432/${POSTGRES_DB:-discrete_modules}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173"]}
      POSTGRES_USER: ${POSTGRES_USER:-discrete_modules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discrete_modules}
      POSTGRES_DB: ${POSTGRES_DB:-discrete_modules}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discrete_modules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discrete_modules}
      POSTGRES_DB: ${POSTGRES_DB:-discrete_modules}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  backend_venv:
  postgres_data:
