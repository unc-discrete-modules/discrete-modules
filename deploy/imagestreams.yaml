apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: discrete-modules-frontend
spec:
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: ghcr.io/1drturtle/discrete-modules-frontend:latest
      importPolicy:
        scheduled: true
